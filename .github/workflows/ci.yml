name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Build deterministic package twice
        run: |
          npm run build
          cp build/cdp_roadmap-0.4.1.tgz /tmp/first.tgz
          npm run build
          cmp /tmp/first.tgz build/cdp_roadmap-0.4.1.tgz
      - name: Verify package checksum contract
        run: python3 -m unittest tests.test_release.ReactRelease.test_archive_matches_current_sources_and_manifest -v
